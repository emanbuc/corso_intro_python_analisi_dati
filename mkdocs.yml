site_name: Introduzione a Python per l'analisi dati
site_description: Corso introduttivo in 3 lezioni - Python, NumPy, pandas, Matplotlib e seaborn
site_url: https://emanbuc.github.io/corso_intro_python_analisi_dati/
repo_url: https://github.com/emanbuc/corso_intro_python_analisi_dati
repo_name: emanbuc/corso_intro_python_analisi_dati
edit_uri: ""

theme:
  name: material
  language: it
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Programma: programma.md
  - Lezioni:
      - "1. Fondamenti di Python": lezioni/01-fondamenti-python.md
      - "2. NumPy e pandas": lezioni/02-numpy-pandas.md
      - "3. Analisi e visualizzazione": lezioni/03-analisi-visualizzazione.md
  - Esempio realistico: esempi/turismo-milano.md
  - Esercitazioni:
      - "1. Fondamenti di Python": esercitazioni/01-fondamenti-python.md
      - "2. NumPy e pandas": esercitazioni/02-numpy-pandas.md
      - "3. Analisi e visualizzazione": esercitazioni/03-analisi-visualizzazione.md
      - "Mini-progetto finale": esercitazioni/04-mini-progetto.md
  - Soluzioni:
      - "Esercitazione 1": soluzioni/01-fondamenti-python.md
      - "Esercitazione 2": soluzioni/02-numpy-pandas.md
      - "Esercitazione 3": soluzioni/03-analisi-visualizzazione.md
  - Dataset: dati.md
  - Risorse: risorse.md
